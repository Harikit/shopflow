name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build Docker image
        working-directory: .
        run: docker build -t shopflow-api:${{ github.sha }} -f api/Dockerfile ./api

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shopflow-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          trivyignores: api/.trivyignore

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag shopflow-api:${{ github.sha }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/shopflow-api:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/shopflow-api:${{ github.sha }}
